<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Матрица системных протоколов | 114 Сур Корана</title>
  <style>
    :root {
      --bg-base: #090d14;
      --bg-surface: #0f1523;
      --bg-card: #151d2e;
      --bg-hover: #1c273d;
      --border: #223047;
      --border-focus: #3b82f6;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.14);
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.12);
      --purple: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.15);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      --code-bg: #0b101b;
      --font-mono: "Fira Code", Consolas, Monaco, monospace;
      --sidebar-w: 320px;
      --transition: 0.24s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      overflow: hidden;
    }

    body {
      display: flex;
      position: relative;
    }

    /* ЗОНА ДЕТЕКЦИИ НАВЕДЕНИЯ МЫШИ (ДЕСКТОП) */
    .edge-sensor {
      position: fixed;
      left: 0;
      top: 0;
      width: 18px;
      height: 100vh;
      z-index: 95;
      display: none;
      cursor: pointer;
    }
    body.is-collapsed .edge-sensor {
      display: block;
    }

    /* БОКОВАЯ ПАНЕЛЬ */
    .sidebar {
      width: var(--sidebar-w);
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width var(--transition), transform var(--transition), box-shadow var(--transition);
      z-index: 100;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* СВОРАЧИВАНИЕ В ПОЛНЫЙ НОЛЬ НА ДЕСКТОПЕ */
    .sidebar.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      border-right: none !important;
      pointer-events: none;
    }

    /* РЕЖИМ ВСПЛЫТИЯ ПРИ НАВЕДЕНИИ К КРАЮ */
    .sidebar.peeking {
      position: fixed;
      left: 0;
      top: 0;
      width: var(--sidebar-w) !important;
      box-shadow: 14px 0 36px rgba(0, 0, 0, 0.7);
      border-right: 1px solid var(--border) !important;
      pointer-events: auto !important;
      z-index: 120;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
    }
    .brand-title {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-main);
    }
    .brand-sub {
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .icon-btn:hover {
      color: #fff;
      border-color: var(--emerald);
      background: var(--bg-hover);
    }

    .manifest-sidebar-btn {
      margin: 10px 12px 4px 12px;
      padding: 10px 14px;
      background: var(--purple-glow);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 8px;
      color: #e9d5ff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .manifest-sidebar-btn:hover, .manifest-sidebar-btn.active {
      background: #9333ea;
      color: #fff;
      border-color: #a855f7;
    }

    .btn-glossary {
      margin: 4px 12px 8px 12px;
      background: var(--cyan-glow);
      border-color: rgba(56, 189, 248, 0.4);
      color: #bae6fd;
    }
    .btn-glossary:hover, .btn-glossary.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    .search-box {
      padding: 8px 12px 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 0.8rem;
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus { border-color: var(--border-focus); }

    .nav-list {
      list-style: none;
      padding: 8px;
      overflow-y: auto;
      flex-grow: 1;
    }
    .nav-item {
      padding: 9px 12px;
      margin-bottom: 4px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      color: var(--text-muted);
      transition: var(--transition);
    }
    .nav-item:hover { background: var(--bg-hover); color: var(--text-main); }
    .nav-item.active { background: var(--emerald-glow); border-color: var(--emerald); color: #fff; }

    .nav-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .nav-num {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--emerald);
      flex-shrink: 0;
    }
    .nav-item.active .nav-num { background: var(--emerald); color: #000; }
    .nav-text-group { display: flex; flex-direction: column; overflow: hidden; white-space: nowrap; }
    .nav-name { font-size: 0.84rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .nav-meta { font-size: 0.7rem; color: var(--text-dim); }
    .nav-badge {
      font-size: 0.68rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-dim);
      white-space: nowrap;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* ОСНОВНАЯ ОБЛАСТЬ ПРОСМОТРА */
    .main-viewport {
      flex-grow: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .topbar {
      padding: 10px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 12px;
      min-height: 58px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      overflow: hidden;
    }
    .topbar-info {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--emerald);
      background: var(--emerald-glow);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald);
    }

    .content-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px 60px 20px;
      width: 100%;
      min-width: 0;
    }

    /* СУРА БАННЕР */
    .sura-banner {
      background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-card) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
    }
    .sura-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .sura-header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .sura-header-meta {
      font-size: 0.9rem;
      color: var(--gold);
      font-weight: 500;
    }
    .header-actions { display: flex; gap: 8px; }

    .action-btn {
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      white-space: nowrap;
    }
    .action-btn:hover { border-color: var(--gold); background: var(--gold-glow); }

    .source-panel {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .source-panel.open { display: block; }
    .source-card {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .arabic-display {
      font-size: 1.35rem;
      line-height: 2.1;
      direction: rtl;
      text-align: right;
      color: #f8fafc;
      font-family: "Amiri", "Traditional Arabic", serif;
      margin-bottom: 12px;
      word-break: break-word;
    }
    .translation-display {
      font-size: 0.92rem;
      color: var(--text-muted);
      border-left: 2px solid var(--gold);
      padding-left: 12px;
      word-break: break-word;
    }
    .summary-display {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 0.9rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* УЗЛЫ И КАРТОЧКИ */
    .nodes-container { display: flex; flex-direction: column; gap: 16px; }
    .node-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color var(--transition);
    }
    .node-card:hover { border-color: var(--border-focus); }
    .node-header {
      padding: 14px 18px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .node-title-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .node-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--emerald);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .node-title {
      font-size: 0.96rem;
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .node-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .node-ayat-source {
      background: var(--code-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.84rem;
    }
    .node-ayat-source summary {
      cursor: pointer;
      color: var(--text-dim);
      font-weight: 600;
      outline: none;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .node-ayat-source summary:hover { color: var(--text-muted); }
    .node-ayat-content {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      word-break: break-word;
    }

    .triad-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .triad-cell {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .triad-header {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .triad-cell.law .triad-header { color: var(--gold); }
    .triad-cell.medic .triad-header { color: var(--emerald); }
    .triad-cell p { font-size: 0.88rem; color: var(--text-main); line-height: 1.5; }

    .prompt-box {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
    }
    .prompt-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 10px;
    }
    .copy-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
      white-space: nowrap;
    }
    .copy-btn:hover { color: #fff; border-color: var(--emerald); background: var(--bg-hover); }
    .copy-btn.copied { background: var(--emerald); color: #000; font-weight: 700; border-color: var(--emerald); }
    .prompt-text {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #93c5fd;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
    }

    .checklist-box {
      margin-top: 28px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
    }
    .checklist-box h3 { font-size: 1.05rem; color: var(--gold); margin-bottom: 14px; }
    .checklist-items { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .checklist-items li { font-size: 0.88rem; display: flex; align-items: flex-start; gap: 12px; color: var(--text-main); }
    .checklist-idx { color: var(--gold); font-weight: 700; font-family: var(--font-mono); }

    /* ТАБЛИЦА И СКРОЛЛ */
    .table-scroll-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 14px;
    }
    .ikr-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 580px;
      font-size: 0.86rem;
    }
    .ikr-table th {
      background: var(--bg-surface);
      color: var(--emerald);
      text-align: left;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .ikr-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.5;
    }
    .ikr-table tr:last-child td { border-bottom: none; }
    .param-title { font-weight: 700; color: #fff; margin-bottom: 3px; display: block; }
    .param-desc { font-size: 0.74rem; color: var(--gold); }

    /* МАНИФЕСТ И ГЛОССАРИЙ */
    .manifest-container, .glossary-container {
      display: flex;
      flex-direction: column;
      gap: 22px;
      animation: fadeIn 0.2s ease;
    }
    .manifest-axiom, .glossary-banner {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.12) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 22px;
    }
    .glossary-banner {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12) 0%, rgba(15, 23, 42, 0.9) 100%);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .manifest-axiom h2, .glossary-banner h1 { font-size: 1.35rem; color: #fff; margin-bottom: 6px; font-weight: 700; }
    .manifest-axiom p { font-size: 0.92rem; color: #f1f5f9; line-height: 1.6; }
    .glossary-banner p { font-size: 0.92rem; color: #bae6fd; line-height: 1.6; }

    .full-prompt-card { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .full-prompt-text {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #93c5fd;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      max-height: 480px;
      overflow-y: auto;
      padding: 12px;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .explanation-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
    .exp-item { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .exp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
    .exp-title { font-size: 0.92rem; font-weight: 700; color: var(--emerald); }
    .exp-law { font-size: 0.72rem; font-weight: 600; color: var(--gold); padding: 2px 8px; background: rgba(245, 158, 11, 0.1); border-radius: 4px; border: 1px solid rgba(245, 158, 11, 0.3); white-space: nowrap; }
    .exp-body { font-size: 0.86rem; color: var(--text-main); line-height: 1.55; }

    .glossary-filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .filter-chip {
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.76rem;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-chip:hover, .filter-chip.active { background: rgba(56, 189, 248, 0.2); color: #fff; border-color: #38bdf8; }

    .glossary-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .glossary-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color var(--transition); }
    .glossary-card:hover { border-color: #38bdf8; }
    .glossary-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 12px; }
    .glossary-term-group { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .glossary-term { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .glossary-arabic { font-family: "Amiri", "Traditional Arabic", serif; font-size: 1.25rem; color: var(--gold); direction: rtl; }
    .glossary-literal { font-size: 0.78rem; color: var(--text-dim); font-style: italic; }
    .glossary-cat-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      white-space: nowrap;
    }
    .glossary-meaning { font-size: 0.88rem; color: var(--text-main); line-height: 1.55; margin-bottom: 10px; }
    .glossary-law-box {
      background: var(--code-bg);
      border-left: 3px solid var(--emerald);
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 0.8rem;
      color: #94a3b8;
      line-height: 1.45;
    }
    .glossary-law-box strong { color: var(--emerald); }

    /* ЗАТЕМНЕНИЕ ФОНА (МОБИЛЬНАЯ ВЕРСИЯ) */
    .mobile-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 12, 0.75);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      transition: opacity var(--transition);
    }

    /* АДАПТИВНОСТЬ (МОБИЛЬНЫЕ И ПЛАНШЕТЫ) */
    @media (max-width: 768px) {
      .edge-sensor { display: none !important; }
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;

      if (isMobile()) {
        sidebar.classList.toggle('mobile-open');
        mobileBackdrop.classList.toggle('active', sidebar.classList.contains('mobile-open'));
      } else {
        const isCollapsed = sidebar.classList.toggle('collapsed');
        document.body.classList.toggle('is-collapsed', isCollapsed);
        sidebar.classList.remove('peeking');
      }
    }

    function closeSidebar() {
      if (isMobile()) {
        sidebar.classList.remove('mobile-open');
        mobileBackdrop.classList.remove('active');
      } else {
        sidebar.classList.remove('peeking');
      }
    }

    // Обработчики кнопок меню
    document.getElementById('topbarNavToggle').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    mobileBackdrop.addEventListener('click', closeSidebar);

    // Подвод мышки к левому краю экрана на десктопе раскрывает панель
    edgeSensor.addEventListener('mouseenter', () => {
      if (!isMobile() && sidebar.classList.contains('collapsed')) {
        sidebar.classList.add('peeking');
      }
    });

    sidebar.addEventListener('mouseleave', () => {
      if (!isMobile() && sidebar.classList.contains('collapsed')) {
        sidebar.classList.remove('peeking');
      }
    });

    // СТАРТ
    initNavList();
    renderSura(1);
  </script>
</body>
</html>
